<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDI Agent</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --panel2: #222b36; --line: #2d3742;
    --txt: #e6edf3; --muted: #8b98a5; --accent: #2f81f7; --accent2: #238636;
    --warn: #d29922; --danger: #f85149; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--txt); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .pill { font-size: 11px; color: var(--muted); border: 1px solid var(--line);
          padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .pill.on { color: var(--ok); border-color: var(--accent2); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  main { flex: 1; display: flex; min-height: 0; }
  .chat { flex: 1.3; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  .doc  { flex: 1; display: flex; flex-direction: column; background: var(--panel); min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 14px; display: flex; gap: 10px; }
  .msg .who { font-size: 11px; color: var(--muted); width: 52px; flex-shrink: 0; padding-top: 3px; }
  .msg .body { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
               padding: 9px 12px; white-space: pre-wrap; word-break: break-word; max-width: 90%; }
  .msg.me .body  { background: #15314f; border-color: #1f6feb; }
  .msg.agent .body { background: var(--panel2); }
  .msg .body strong { color: #fff; }
  .msg .body code { background: #0d1117; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  form#chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea#input { flex: 1; resize: none; background: var(--bg); color: var(--txt); border: 1px solid var(--line);
                  border-radius: 8px; padding: 9px 12px; font: inherit; min-height: 42px; max-height: 160px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 0 18px;
           font-weight: 600; cursor: pointer; font-size: 13px; }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; font-size: 12px; }
  button.danger { background: var(--danger); }
  button.ok     { background: var(--accent2); }

  /* Doc panel */
  .doc h2 { font-size: 13px; margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--muted);
            display: flex; align-items: center; gap: 8px; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 42px; }
  .tabs button { background: var(--panel2); color: var(--muted); padding: 4px 12px; font-size: 12px;
                 border-radius: 6px; position: relative; }
  .tabs button.active { background: var(--accent); color: #fff; }
  .tabs button .badge { font-size: 9px; margin-left: 4px; vertical-align: super; }
  .tabs button .badge.corrected { color: var(--ok); }
  .tabs button .badge.warn      { color: var(--warn); }
  pre#docview { flex: 1; overflow: auto; margin: 0; padding: 16px;
                font: 12px/1.6 "SF Mono", Menlo, monospace;
                color: #b9f6ca; white-space: pre-wrap; word-break: break-all; }
  .docbar { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }

  /* Fix-rejection panel */
  .fix-panel { display: none; flex-direction: column; gap: 10px;
               padding: 14px 14px 10px; border-top: 2px solid var(--warn);
               background: var(--panel2); }
  .fix-panel.open { display: flex; }
  .fix-panel label { font-size: 12px; color: var(--warn); font-weight: 600; }
  .fix-panel textarea { background: var(--bg); color: var(--txt); border: 1px solid var(--warn);
                        border-radius: 6px; padding: 9px; font: 12px/1.5 monospace;
                        min-height: 90px; max-height: 200px; resize: vertical; width: 100%; }
  .fix-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fix-row select { background: var(--bg); color: var(--txt); border: 1px solid var(--line);
                    border-radius: 6px; padding: 5px 8px; font: inherit; }
  #fix-status { font-size: 12px; color: var(--muted); }
  #fix-status.err { color: var(--danger); }
  #fix-status.ok  { color: var(--ok); }

  /* Spec upload panel */
  .spec-panel { display: none; align-items: center; gap: 8px; padding: 8px 12px;
                background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .spec-panel.open { display: flex; }
  .spec-panel select, .spec-panel input {
    background: var(--bg); color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; min-height: 30px;
  }
  .spec-panel input[type="text"] { width: 180px; }
  .spec-panel input[type="file"] { max-width: 320px; }
  .spec-panel button { padding: 5px 12px; font-size: 12px; border-radius: 6px; }

  .suggest { padding: 6px 16px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .suggest button { background: transparent; border: 1px solid var(--line); color: var(--muted);
                    font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 400; }
  .empty { color: var(--muted); padding: 24px 16px; font-style: italic; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>🧾 EDI Agent</h1>
  <span class="pill" id="po-pill">no active PO</span>
  <span class="pill" id="mode-pill">mode: …</span>
  <span class="pill" id="orderful-pill">Orderful: …</span>
  <span class="pill" id="spec-pill">specs: …</span>
  <span class="pill" id="learn-pill" title="Failures the agent has learned from">learned: …</span>
  <span style="flex:1"></span>
  <button class="ghost" id="sample-btn">Load sample 850</button>
  <button class="ghost" id="spec-btn">Upload spec</button>
  <button class="ghost" id="reset-btn">Reset</button>
</header>

<div class="spec-panel" id="spec-panel">
  <select id="spec-doc-type" aria-label="Doc type">
    <option value="855">855</option><option value="856">856</option>
    <option value="810">810</option><option value="997">997</option><option value="850">850</option>
  </select>
  <input id="spec-partner" type="text" placeholder="Trading partner ID (e.g. WALMART)" />
  <input type="file" id="spec-file" accept="application/pdf" />
  <button type="button" id="spec-upload-btn">Upload</button>
  <button type="button" class="ghost" id="spec-cancel-btn">Cancel</button>
</div>

<main>
  <!-- ── Chat column ── -->
  <section class="chat">
    <div id="log"></div>
    <div class="suggest" id="suggest"></div>
    <form id="chat-form">
      <textarea id="input" placeholder="Paste an X12 850 (starts with ISA), or type a command. Shift+Enter for newline."></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </section>

  <!-- ── Doc viewer column ── -->
  <section class="doc">
    <h2>
      Generated documents
      <span id="spec-guided-badge" class="pill" style="display:none">spec-guided ✓</span>
    </h2>
    <div class="tabs" id="tabs"></div>
    <pre id="docview"><span class="empty">Generated EDI will appear here. Parse an 850, set your mappings, then ask me to generate the 997 / 855 / 856 / 810.</span></pre>

    <div class="docbar">
      <button class="ghost" id="copy-btn">Copy</button>
      <button class="ghost" id="download-btn">Download .edi</button>
      <button class="ghost" id="refresh-btn">↻ Refresh</button>
      <span style="flex:1"></span>
      <button class="ghost" id="workflow-btn" style="border-color:var(--ok);color:var(--ok)" disabled>⚡ Wire up workflow</button>
      <button class="ghost" id="fix-btn" style="border-color:var(--warn);color:var(--warn)">⚠ Fix Rejection</button>
    </div>

    <!-- Error correction panel -->
    <div class="fix-panel" id="fix-panel">
      <label>Paste the partner rejection / error message below</label>
      <textarea id="fix-error-msg" placeholder="e.g.:
Segment SE01 count mismatch: declared 12, actual 15
Missing required segment N1:ST in transaction 855
Invalid qualifier ZZ in ISA05 — expected 01"></textarea>
      <label>Rejected EDI file — optional; needed only if there's no active order above</label>
      <textarea id="fix-edi" placeholder="Paste the rejected X12 here (starts with ISA) to correct a file with no active 850 in this session."></textarea>
      <div class="fix-row">
        <select id="fix-doc-type" aria-label="Document type to correct">
          <option value="997">997</option>
          <option value="855">855</option>
          <option value="856">856</option>
          <option value="810">810</option>
        </select>
        <input id="fix-partner" type="text" placeholder="Trading partner (for pasted EDI)" />
        <button id="correct-btn" class="ok">Correct Document</button>
        <button class="ghost" id="fix-cancel-btn">Cancel</button>
        <span id="fix-status"></span>
      </div>
    </div>
  </section>
</main>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const docs = {};           // doc_type -> edi string
const correctedDocs = new Set();
let activeDoc  = null;
let activePO   = null;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const log      = document.getElementById('log');
const input    = document.getElementById('input');
const tabs     = document.getElementById('tabs');
const docview  = document.getElementById('docview');
const suggest  = document.getElementById('suggest');
const fixPanel = document.getElementById('fix-panel');
const fixDocType  = document.getElementById('fix-doc-type');
const fixErrorMsg = document.getElementById('fix-error-msg');
const fixStatus   = document.getElementById('fix-status');

// ── Sample 850 ───────────────────────────────────────────────────────────────
const SAMPLE = `ISA*00*          *00*          *ZZ*ACMERETAIL     *ZZ*JEFFCOFIBRES   *250529*1200*U*00401*000000001*0*P*>~GS*PO*ACMERETAIL*JEFFCOFIBRES*20250529*1200*1*X*004010~ST*850*0001~BEG*00*SA*4500012345**20250529~REF*DP*DEPT42~N1*ST*ACME RETAIL STORE #12*92*0012~N3*123 MAIN STREET~N4*ANYTOWN*NY*10001~N1*BT*ACME CORPORATE*92*0001~N3*456 CORPORATE BLVD~N4*BIGCITY*NY*10002~N1*BY*ACME BUYING GROUP*92*0009~N1*VN*JEFFCO FIBRES*92*JEFF01~PO1*1*100*EA*29.99*PE*BP*BUY-A*VP*ABC123*UP*012345678905~PID*F****PREMIUM FIBER WIDGET~DTM*010*20250605~DTM*002*20250610~PO1*2*50*CA*49.99*PE*BP*BUY-B*VP*DEF456*UP*012345678912~PID*F****DELUXE FIBER WIDGET~DTM*010*20250605~CTT*2~SE*20*0001~GE*1*1~IEA*1*000000001~`;

const SUGGESTIONS = [
  'show order','set price ABC123 29.99','carrier UPSN','ship method GROUND',
  'ship date 20250605','tracking 1Z999AA10123456784','generate 855','generate 856',
  'generate 810','generate all','help'
];

// ── Helpers ──────────────────────────────────────────────────────────────────
function md(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}

function addMsg(who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (who === 'You' ? 'me' : 'agent');
  div.innerHTML = `<div class="who">${who}</div><div class="body">${md(text)}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function setPO(po) {
  activePO = po;
  document.getElementById('po-pill').textContent = po ? ('PO ' + po) : 'no active PO';
}

// ── Tab / doc rendering ──────────────────────────────────────────────────────
function renderTabs() {
  const prev = activeDoc;
  tabs.innerHTML = '';
  Object.keys(docs).sort().forEach(dt => {
    const b = document.createElement('button');
    const badge = correctedDocs.has(dt) ? '<span class="badge corrected">FIXED</span>' : '';
    b.innerHTML = dt + badge;
    b.className = dt === activeDoc ? 'active' : '';
    b.onclick = () => { activeDoc = dt; renderTabs(); showDoc(); };
    tabs.appendChild(b);
  });
}

function showDoc() {
  if (!activeDoc || !docs[activeDoc]) return;
  docview.textContent = docs[activeDoc].replace(/~/g,'~\n').trim();
  renderTabs();
  // The workflow can be wired up once a document has been produced.
  const wf = document.getElementById('workflow-btn');
  if (wf) wf.disabled = !(activePO && Object.keys(docs).length);
}

function addDoc(dt, edi, activate = true) {
  if (!dt || !edi) return;
  docs[dt] = edi;
  if (activate || !activeDoc) activeDoc = dt;
  showDoc();
}

// ── Refresh all docs from the server ─────────────────────────────────────────
async function refreshDocs(status, preferDoc) {
  if (!status || !status.po_number || !status.documents_generated) return;
  const po = status.po_number;
  for (const dt of status.documents_generated) {
    try {
      const r  = await fetch(`/order/${po}/output/${dt}?t=${Date.now()}`);
      const ev = await r.json();
      if (ev.success && ev.data && ev.data.edi) {
        docs[dt] = ev.data.edi;          // update in place, don't auto-activate
      }
    } catch (_) {}
  }
  if (preferDoc && docs[preferDoc]) activeDoc = preferDoc;
  else if (!activeDoc && status.documents_generated.length)
    activeDoc = status.documents_generated[0];
  showDoc();
}

// ── Chat send ────────────────────────────────────────────────────────────────
async function send(text) {
  addMsg('You', text);
  input.value = '';
  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  try {
    const r   = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, po_number: activePO })
    });
    const env = await r.json();
    if (!env.success) {
      addMsg('Agent', '⚠️ ' + (env.error?.message || 'request failed'));
      return;
    }
    const data = env.data || {};
    if (data.po_number) setPO(data.po_number);
    // Add any inline EDI returned directly (deterministic path)
    if (data.edi && data.doc_type) addDoc(data.doc_type, data.edi);
    addMsg('Agent', data.reply || '(no reply)');
    // Always refresh all generated docs so corrections / rewrites are visible
    await refreshDocs(data.status, data.doc_type);
  } catch (e) {
    addMsg('Agent', '⚠️ Request failed: ' + e.message);
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById('chat-form').onsubmit = (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (t) send(t);
};
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('chat-form').requestSubmit(); }
});

// ── Fix-rejection panel ──────────────────────────────────────────────────────
document.getElementById('fix-btn').onclick = () => {
  const open = fixPanel.classList.toggle('open');
  if (open) {
    if (activeDoc) fixDocType.value = activeDoc;
    fixErrorMsg.focus();
    fixStatus.textContent = '';
    fixStatus.className = '';
  }
};
document.getElementById('fix-cancel-btn').onclick = () => {
  fixPanel.classList.remove('open');
};

document.getElementById('correct-btn').onclick = async () => {
  const dt  = fixDocType.value;
  const msg = fixErrorMsg.value.trim();
  const pastedEdi = document.getElementById('fix-edi').value.trim();
  const partner = document.getElementById('fix-partner').value.trim();
  if (!msg) {
    fixStatus.textContent = 'Paste the rejection / error message first.';
    fixStatus.className = 'err';
    return;
  }
  // Standalone path when a rejected file is pasted or there's no active order.
  const standalone = !!pastedEdi || !activePO;
  if (standalone && !pastedEdi) {
    fixStatus.textContent = 'No active order — paste the rejected EDI (and partner) to correct it.';
    fixStatus.className = 'err';
    return;
  }

  fixStatus.innerHTML = '<span class="spinner"></span> Correcting…';
  fixStatus.className = '';
  document.getElementById('correct-btn').disabled = true;

  try {
    let r;
    if (standalone) {
      r = await fetch('/correct', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ edi: pastedEdi, failure_message: msg,
                               doc_type: dt, trading_partner: partner || null })
      });
    } else {
      r = await fetch(`/order/${activePO}/correct/${dt}`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ failure_message: msg, submit: false })
      });
    }
    const env = await r.json();
    if (env.success && env.data && env.data.edi) {
      const rdt = env.data.doc_type || dt;
      correctedDocs.add(rdt);
      addDoc(rdt, env.data.edi, true);   // activate the corrected doc in the viewer
      fixStatus.textContent = '✓ Corrected — download and re-upload to the partner portal.';
      fixStatus.className = 'ok';
      addMsg('Agent', `✓ **${rdt}** corrected from the rejection message`
        + (standalone ? ' (standalone file)' : '') + `. Updated in the viewer — download and re-upload.`);
      fixErrorMsg.value = '';
      document.getElementById('fix-edi').value = '';
      setTimeout(() => fixPanel.classList.remove('open'), 2500);
    } else {
      const errMsg = env.error?.message || 'Correction failed.';
      fixStatus.textContent = '✗ ' + errMsg;
      fixStatus.className = 'err';
      addMsg('Agent', `⚠️ Could not correct **${dt}**: ${errMsg}\n\n`
        + `Make sure you have:\n`
        + `1. A companion guide PDF uploaded for this partner (Upload spec button)\n`
        + `2. ANTHROPIC_API_KEY set in edi_agent/.env`);
    }
  } catch (e) {
    fixStatus.textContent = '✗ ' + e.message;
    fixStatus.className = 'err';
  } finally {
    document.getElementById('correct-btn').disabled = false;
  }
};

// ── Wire up workflow (build the LogicBroker-style automation) ────────────────
document.getElementById('workflow-btn').onclick = async () => {
  if (!activePO) return;
  const btn = document.getElementById('workflow-btn');
  btn.disabled = true;
  addMsg('You', '⚡ Wire up the workflow for this partner');
  try {
    const r = await fetch(`/order/${activePO}/activate-workflow`, { method: 'POST' });
    const env = await r.json();
    if (!env.success) {
      addMsg('Agent', '⚠️ ' + (env.error?.message || 'Could not wire up the workflow.'));
      return;
    }
    const d = env.data;
    if (d.activated) {
      const phases = (d.workflow.phases || [])
        .map(p => `  • **${p.phase}** — ${p.trigger} → ${(p.produces || []).join(', ')}`
                  + (p.sink ? ` → ${p.sink}` : ''))
        .join('\n');
      addMsg('Agent',
        `✓ Workflow wired up for **${d.trading_partner || '(generic)'}**.\n\n`
        + `Docs validated: ${d.doc_types.join(', ')}\n\n**Automation phases:**\n${phases}\n\n`
        + `This partner now runs via \`${d.workflow.run}\` (import → ASN → invoice). `
        + `Use the **Run sync** schedule to process new orders automatically.`);
      checkHealth();
    } else {
      const failed = Object.entries(d.report)
        .filter(([, v]) => !v.ok).map(([k, v]) => `${k}: ${v.error}`).join('; ');
      addMsg('Agent', `⚠️ Not wired up — some documents didn't pass:\n${failed}\n\n`
        + `Fix those (often a missing companion guide or a rejection to correct) and try again.`);
    }
  } catch (e) {
    addMsg('Agent', '⚠️ Workflow wiring failed: ' + e.message);
  } finally {
    btn.disabled = !(activePO && Object.keys(docs).length);
  }
};

// ── Manual refresh ───────────────────────────────────────────────────────────
document.getElementById('refresh-btn').onclick = async () => {
  if (!activePO) return;
  try {
    const r  = await fetch(`/order/${activePO}/status`);
    const ev = await r.json();
    if (ev.success && ev.data) {
      const st = ev.data.session_status || ev.data.state;
      await refreshDocs(st, activeDoc);
      addMsg('Agent', '↻ Refreshed generated documents.');
    }
  } catch (e) { addMsg('Agent', '⚠️ Refresh failed: ' + e.message); }
};

// ── Spec upload ──────────────────────────────────────────────────────────────
document.getElementById('spec-btn').onclick = () =>
  document.getElementById('spec-panel').classList.toggle('open');
document.getElementById('spec-cancel-btn').onclick = () => {
  document.getElementById('spec-panel').classList.remove('open');
  document.getElementById('spec-file').value = '';
};
document.getElementById('spec-upload-btn').onclick = async () => {
  const fileInput = document.getElementById('spec-file');
  const f = fileInput.files[0];
  if (!f) { addMsg('Agent', 'Choose a companion-guide PDF first.'); return; }
  const dt = document.getElementById('spec-doc-type').value;
  const tp = document.getElementById('spec-partner').value.trim();
  const fd = new FormData();
  fd.append('doc_type', dt); fd.append('trading_partner', tp); fd.append('file', f);
  addMsg('You', `Uploading ${dt} companion guide: ${f.name}${tp ? ' ('+tp+')' : ''}`);
  try {
    const r   = await fetch('/specs', { method: 'POST', body: fd });
    const env = await r.json();
    if (env.success) {
      addMsg('Agent', `Stored **${dt}** companion guide for **${tp || '(generic)'}**. `
        + `Future generations and corrections will conform to this spec.`);
      document.getElementById('spec-panel').classList.remove('open');
      fileInput.value = '';
      checkHealth();
    } else {
      addMsg('Agent', '⚠️ Upload failed: ' + (env.error?.message || 'error'));
    }
  } catch (err) { addMsg('Agent', '⚠️ Upload failed: ' + err.message); }
};

// ── Utility buttons ──────────────────────────────────────────────────────────
document.getElementById('sample-btn').onclick = () => { input.value = SAMPLE; input.focus(); };
document.getElementById('copy-btn').onclick = () => {
  if (activeDoc && docs[activeDoc]) navigator.clipboard.writeText(docs[activeDoc]);
};
document.getElementById('download-btn').onclick = () => {
  if (!activeDoc || !docs[activeDoc]) return;
  const blob = new Blob([docs[activeDoc]], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${activePO || 'doc'}_${activeDoc}.edi`;
  a.click();
};
document.getElementById('reset-btn').onclick = () => {
  log.innerHTML = '';
  for (const k in docs) delete docs[k];
  correctedDocs.clear();
  activeDoc = null;
  setPO(null);
  fixPanel.classList.remove('open');
  docview.innerHTML = '<span class="empty">Generated EDI will appear here.</span>';
  tabs.innerHTML = '';
  greet();
};

// ── Suggestions ──────────────────────────────────────────────────────────────
function renderSuggestions() {
  suggest.innerHTML = '';
  SUGGESTIONS.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s; b.type = 'button';
    b.onclick = () => { input.value = s; input.focus(); };
    suggest.appendChild(b);
  });
}

// ── Health check ─────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r   = await fetch('/health');
    const env = await r.json();
    const d   = env.data || env;

    const orderfulPill = document.getElementById('orderful-pill');
    if (d.orderful_configured) { orderfulPill.textContent = 'Orderful: live'; orderfulPill.classList.add('on'); }
    else orderfulPill.textContent = 'Orderful: dry-run';

    const modePill = document.getElementById('mode-pill');
    if (d.llm_enabled) { modePill.textContent = 'mode: AI'; modePill.classList.add('on'); }
    else { modePill.textContent = 'mode: commands'; modePill.classList.add('warn'); }

    const specPill = document.getElementById('spec-pill');
    const partners = Array.isArray(d.integrations) ? d.integrations : [];
    if (partners.length) {
      specPill.textContent = 'specs: ' + partners
        .map(p => p.trading_partner + (p.activated ? ' ⚡' : '')).join(', ');
      specPill.classList.add('on');
    } else {
      specPill.textContent = 'no specs uploaded';
    }

    const badge = document.getElementById('spec-guided-badge');
    badge.style.display = d.spec_guided ? '' : 'none';

    const learnPill = document.getElementById('learn-pill');
    const lessons = d.lessons_learned || 0;
    learnPill.textContent = `learned: ${lessons}`;
    if (lessons) learnPill.classList.add('on');
  } catch (_) {}
}

// ── Greeting ─────────────────────────────────────────────────────────────────
function greet() {
  addMsg('Agent',
    "Hi Robert — I'm your EDI agent.\n\n"
    + "**Workflow:**\n"
    + "1. Paste an inbound X12 **850** → I acknowledge with a **997**\n"
    + "2. Set mappings (prices, carrier, ship date)\n"
    + "3. `generate 855` / `generate 856` / `generate 810`\n"
    + "4. Download the .edi → upload to the partner portal\n"
    + "5. If the portal rejects it → click **⚠ Fix Rejection**, paste the error, click Correct\n"
    + "6. Download the corrected file and re-upload\n\n"
    + "No 850 handy? Hit **Load sample 850** and Send. Type `help` anytime.");
}

renderSuggestions();
checkHealth();
greet();
</script>
